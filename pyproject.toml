[project]
name = "clausesight"
version = "0.1.0"
description = "Agentic contract analysis with hybrid retrieval and standards triangulation"
requires-python = ">=3.13"

# Layer 1 only: ingestion + clause extraction. Nothing from Layers 2-6.
dependencies = [
    "pydantic>=2.9",
    "pdfplumber>=0.11",
    "spacy>=3.8",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
